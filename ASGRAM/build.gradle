apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
def uploadSigning = new Properties()
def uploadSigningFile = file('keystore.properties')
if (uploadSigningFile.exists()) uploadSigningFile.withInputStream { uploadSigning.load(it) }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && !uploadSigningFile.exists()) throw new GradleException('ASGRAM release signing is not configured. See ASGRAM.md.')
if (releaseRequested && !file('google-services.json').exists()) throw new GradleException('ASGRAM Firebase configuration is required for release notifications.')
android {
    namespace 'com.abdiisabaa.asgram'
    compileSdkVersion 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.abdiisabaa.asgram'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 6
        versionName '0.3.0'
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (uploadSigningFile.exists()) {
                storeFile file(uploadSigning.getProperty('storeFile'))
                storePassword uploadSigning.getProperty('storePassword')
                keyAlias uploadSigning.getProperty('keyAlias')
                keyPassword uploadSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro' }
    }
    buildFeatures { buildConfig true }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += "pack"; localeFilters += ["zz"] }
    lintOptions { checkReleaseBuilds false; disable 'MissingTranslation','ExtraTranslation' }
}
dependencies {
    implementation project(':TMessagesProj')
    debugImplementation 'androidx.fragment:fragment:1.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'
