apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
android {
    namespace 'com.abdiisabaa.asgram'
    compileSdkVersion 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.abdiisabaa.asgram'
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 3
        versionName '0.2.0'
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro' }
    }
    buildFeatures { buildConfig true }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += "pack"; localeFilters += ["zz"] }
    lintOptions { checkReleaseBuilds false; disable 'MissingTranslation','ExtraTranslation' }
}
dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'
